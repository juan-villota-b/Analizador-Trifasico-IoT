  <rect x="40" y="500" width="160" height="60" rx="6" ry="6" fill="#eaecee" stroke="#566573" stroke-width="1.5"/>
  <text class="boxTitle" x="120" y="525" text-anchor="middle">AP63203</text>
  <text class="detail" x="120" y="545" text-anchor="middle">buck · 3.3 V @ 2 A</text>
