  <rect x="40" y="245" width="160" height="60" rx="6" ry="6" fill="#eaecee" stroke="#566573" stroke-width="1.5"/>
  <text class="boxTitle" x="120" y="270" text-anchor="middle">D200</text>
  <text class="detail" x="120" y="290" text-anchor="middle">OR-ing 5 V</text>
  <line x1="200" y1="275" x2="220" y2="275" stroke="#566573" stroke-width="1.5"/>

  <!-- TPS2553 -->
  <rect x="40" y="330" width="160" height="60" rx="6" ry="6" fill="#eaecee" stroke="#566573" stroke-width="1.5"/>
  <text class="boxTitle" x="120" y="355" text-anchor="middle">TPS2553</text>
  <text class="detail" x="120" y="375" text-anchor="middle">+2×30 F · 15 F</text>
  <line x1="200" y1="360" x2="220" y2="360" stroke="#566573" stroke-width="1.5"/>

  <!-- D201 -->
  <rect x="40" y="415" width="160" height="60" rx="6" ry="6" fill="#eaecee" stroke="#566573" stroke-width="1.5"/>
