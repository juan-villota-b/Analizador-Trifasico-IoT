  <text class="detail" x="530" y="375" text-anchor="middle">F300–F302 (200 mA) + RV300–RV302 (MOV)</text>
  <line x1="530" y1="390" x2="530" y2="420" stroke="#566573" stroke-width="1.5" marker-end="url(#arrowGray)"/>

