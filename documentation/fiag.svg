  <text class="detail" x="530" y="1060" text-anchor="middle">USB / JTAG · EN / BOOT</text>

  <!-- USB-C -->
  <rect x="740" y="1000" width="160" height="70" rx="6" ry="6" fill="#d1f2eb" stroke="#117a65" stroke-width="1.5"/>
