  <rect x="720" y="723" width="16" height="10" fill="#d6eaf8" stroke="#2471a3"/>
  <text class="legendText" x="742" y="732">DGND (SELV)</text>
  <rect x="720" y="738" width="16" height="10" fill="#d5f5e3" stroke="#1e8449"/>
