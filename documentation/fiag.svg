  <rect width="944" height="1232" fill="#ffffff"/>

  <text class="title" x="472" y="35" text-anchor="middle">Analizador Trifásico IoT — Diagrama de bloques final</text>
  <text class="subtitle" x="472" y="62" text-anchor="middle">3P4W · 120/208 V · medición directa · aislamiento galvánico · RS-485 · Wi-Fi HaLow</text>

  <text class="section" x="120" y="105" text-anchor="middle" fill="#566573">ALIMENTACIÓN</text>
  <text class="section" x="530" y="105" text-anchor="middle" fill="#b7950b">MEDIDA Y AISLAMIENTO</text>

  <!-- Bus 5 V -->
  <line x1="220" y1="150" x2="220" y2="660" stroke="#566573" stroke-width="2"/>
  <text class="label" x="228" y="160">5 V</text>

  <!-- Fuente HLK-10M05 -->
  <rect x="40" y="150" width="160" height="70" rx="6" ry="6" fill="#eaecee" stroke="#566573" stroke-width="1.5"/>
