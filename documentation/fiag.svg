  <text class="detailSmall" x="820" y="1048" text-anchor="middle">USB / JTAG</text>
  <text class="detailSmall" x="820" y="1060" text-anchor="middle">programación y monitor</text>
  <line x1="680" y1="1040" x2="740" y2="1040" stroke="#117a65" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
