  <text class="detail" x="120" y="200" text-anchor="middle">AC/DC · 5 V @ 2 A</text>
  <text class="detail" x="120" y="212" text-anchor="middle">3000 VAC</text>
  <line x1="200" y1="185" x2="220" y2="185" stroke="#566573" stroke-width="1.5"/>

